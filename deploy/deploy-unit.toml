type = "path"
io = "output"
pattern = "^/job/out/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
max_length = 160

[[jobs.args]]
flag = "--manifest"
type = "path"
io = "input"
pattern = "^/job/in/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
max_length = 160

[[jobs]]
name = "import_execute"
role = "import"
command = ["python", "-m", "erp_v2.importer", "execute"]
trigger = "operator"
timeout_seconds = 2400
materials = ["MIGRATION_DATABASE_URL", "LEGACY_DATABASE_URL"]
runbook = "docs/rehearsal.md"

[[jobs.args]]
flag = "--receipt"
type = "path"
io = "output"
pattern = "^/job/out/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
max_length = 160
required = true

[[jobs.args]]
flag = "--manifest"
type = "path"
io = "input"
pattern = "^/job/in/[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"

# Gate 5 candidate service, run BESIDE legacy on the production
# host until the nginx switch. Loopback only. Legacy project at
# /root/dotmac stays untouched; rollback = remove this service.
#
#   docker compose -f deploy/docker-compose.candidate.yml up -d
#
# Image: exact-wheel candidate from GHCR (see repo Dockerfile and
# .github/workflows/image.yml). Env values come from an operator
# env file on the host (never Git):
#   ERP_V2_IMAGE=ghcr.io/michaelayoade/dotmac_erp_v2:sha-<candidate>
#   ERP_V2_DATABASE_URL=postgresql+psycopg://erp_v2_runtime:...@dotmac_pg_local:5432/erp_v2
#
# Database reachability: the service joins the legacy compose
# network (dotmac_default, external) and talks to the PG
# container by name. host.docker.internal -> published port is
# firewall-blocked on the prod host (proven 2026-11-09), so do
# not route the DSN through the host gateway.
services:
  erp_v2_app:
    image: ${ERP_V2_IMAGE:?candidate image required}
    container_name: dotmac_erp_v2_app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${ERP_V2_DATABASE_URL:?runtime DSN required}
      ERP_WEB_ENABLED: "true"
      ENVIRONMENT: production
      PLATFORM_DATABASE_URL: ${ERP_V2_DATABASE_URL:?runtime DSN required}
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:?production root domain required}
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:?explicit trusted hosts required},127.0.0.1"
      JWT_SECRET: ${JWT_SECRET:?runtime JWT secret required}
      SESSION_HASH_SECRET: ${SESSION_HASH_SECRET:?runtime session secret required}
      CSRF_SECRET: ${CSRF_SECRET:?runtime CSRF secret required}
      CSRF_ENABLED: "true"
      SEED_ON_STARTUP: "false"
      # Optional: empty keeps the Academy machine-key route closed (503).
      MACHINE_CREDENTIAL_HMAC_KEY: ${MACHINE_CREDENTIAL_HMAC_KEY:-}
      ACADEMY_SYNC_TENANT_ID: ${ACADEMY_SYNC_TENANT_ID:-}
    ports:
      - "127.0.0.1:8013:8000"
    networks:
      - dotmac_default

networks:
  dotmac_default:
    external: true

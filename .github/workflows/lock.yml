name: lock

# Manual lockfile refresh: resolves against the released wheels on
# the Forgejo index (FORGEJO_READ_TOKEN secret) and uploads uv.lock
# as an artifact for a human-reviewed commit. Never runs on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Resolve lockfile
        env:
          UV_INDEX_FORGEJO_USERNAME: ci-reader
          UV_INDEX_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: uv lock

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error

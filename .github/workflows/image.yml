name: image

# Manual exact-wheel candidate image build (Gate 1). Installs
# exactly the committed uv.lock from the Forgejo index; the read
# token is a BuildKit secret, never a layer. Pushes to GHCR.
# Deployment itself stays a separate, explicit step.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build candidate image
        env:
          FORGEJO_READ_TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
          DOCKER_BUILDKIT: "1"
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          docker build \
            --secret id=forgejo_token,env=FORGEJO_READ_TOKEN \
            -t "ghcr.io/michaelayoade/dotmac_erp_v2:sha-$SHORT_SHA" \
            -t "ghcr.io/michaelayoade/dotmac_erp_v2:candidate" \
            .

      - name: Push candidate image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/michaelayoade/dotmac_erp_v2:sha-$SHORT_SHA"
          docker push "ghcr.io/michaelayoade/dotmac_erp_v2:candidate"
          # Verify with the job's own login (the new package is
          # private; anonymous reads are denied).
          docker manifest inspect "ghcr.io/michaelayoade/dotmac_erp_v2:sha-$SHORT_SHA" > /dev/null
          echo "manifest verified for sha-$SHORT_SHA"

      # Release record (deploy design WP4): a build artifact only. It states
      # what was published and carries the exact deploy-unit.toml bytes with
      # their sha256. One image per version: the two tags above name the SAME
      # image, so exactly one repo@digest is recorded. No publish, no secret.
      - name: Produce release record
        run: |
          set -euo pipefail
          ref="ghcr.io/michaelayoade/dotmac_erp_v2:sha-$SHORT_SHA"
          image="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")"
          version="$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          python3 scripts/release_record.py \
            --image "$image" \
            --revision "$GITHUB_SHA" \
            --version "$version" \
            --descriptor deploy/deploy-unit.toml \
            --out release-record

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-record-${{ github.sha }}
          path: release-record/
          if-no-files-found: error
